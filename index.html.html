.back{display:none}

.sws{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:8px}.sw{display:grid;gap:6px;justify-items:center;font-size:12px;padding:10px 4px;border:2px solid transparent;background:var(--s2)}.sw span{width:34px;height:34px;border-radius:50%;background:var(--c);border:1px solid #0002}.sw.on{border-color:var(--ac)}

 if(tab=='chats'){const g={};for(const m of M.values()){const o=m.from==me?m.to:m.from;(g[o]=g[o]||[]).push(m)}
  const pins=U[me].pins||[];
  let fr=friends().map(u=>{const ms=(g[u]||[]).sort((x,y)=>x.ts-y.ts),l=ms[ms.length-1];return{u,l,n:ms.filter(m=>m.from==u&&!m.read&&!m.del).length,t:l?l.ts:0,p:pins.includes(u)?1:0}});

 if(tab=='friends'){const rs=[...R.values()],inc=rs.filter(r=>r.to==me&&r.st=='p'),out=rs.filter(r=>r.from==me&&r.st=='p');
  h=`<div class="row pad"><input id="fu" placeholder="Friend ka username" style="flex:1"><button class="pri" onclick="addF()">Add</button></div>`;
  if(inc.length)h+='<div class="sec">Friend requests</div>'+inc.map(r=>`<div class="it">${av(r.from)}<div class="b"><b>${esc(nm(r.from))}</b><div class="mu">@${esc((U[r.from]||{}).username||'')}</div></div><button class="pri" onclick="resp('${r.id}',1)">Accept</button><button onclick="resp('${r.id}',0)">✕</button></div>`).join('');
  if(out.length)h+='<div class="sec">Sent</div>'+out.map(r=>`<div class="it">${av(r.to)}<div class="b"><b>${esc(nm(r.to))}</b><div class="mu">Pending…</div></div></div>`).join('');
  h+='<div class="sec">Friends</div>'+(friends().map(u=>`<div class="it" data-o="${u}">${avo(u)}<div class="b"><b>${esc(nm(u))}</b><div class="mu">${pres(u)||'@'+esc(U[u].username)}</div></div></div>`).join('')||'<p class="mu pad">Abhi koi nahi</p>')}
 if(tab=='status'){h=`<div class="st"><textarea id="stx" placeholder="Apna status likhein…" style="height:70px"></textarea><div class="row" style="margin-top:10px"><button class="pri" onclick="postSt()">Post</button><label class="mu" style="cursor:pointer;padding:8px">📷 Photo<input type="file" accept="image/*" hidden onchange="postImg(this)"></label></div></div>`;
  const s=[...ST.values()].filter(x=>Date.now()-x.ts<864e5&&(x.u==me||isF(me,x.u))).sort((a,b)=>b.ts-a.ts);
  h+=s.map(x=>`<div class="st"><div class="row">${av(x.u,32)}<b>${x.u==me?'My status':esc(nm(x.u))}</b><span class="mu">${tm(x.ts)}</span></div>${x.text?`<p style="margin-top:8px">${esc(x.text)}</p>`:''}${x.data?`<img src="${x.data}">`:''}</div>`).join('')||'<p class="mu c pad">Koi status nahi (24 ghante tak rehta hai)</p>'}
 if(tab=='calls'){const ca=act(),c=[...CL.values()].sort((a,b)=>b.ts-a.ts);
  h=c.map(c=>{const o=c.from==me?c.to:c.from,out=c.from==me;let s=c.st,bad=0;if(s=='ring'&&c!==ca)s='missed';if(s=='missed'||s=='declined'||s=='cancelled')bad=!out&&s!='cancelled';if(s=='end'||s=='on')s=Math.floor((c.dur||0)/60)+'m '+(c.dur||0)%60+'s';
   return`<div class="it" onclick="call('${o}','${c.kind}')">${av(o)}<div class="b"><b style="${bad?'color:#e11d48':''}">${esc(nm(o))}</b><div class="mu">${out?'↗ Outgoing':'↙ Incoming'} ${c.kind} • ${s} • ${dt(c.ts)}</div></div><span style="color:var(--ac)">${i(c.kind=='video'?'video':'phone')}</span></div>`}).join('')||'<p class="mu c pad" style="padding:30px">Call history khaali hai</p>'}
 if(tab=='set'){const u=U[me],p=u.priv||{};
  const tg=(k,l)=>`<div class="row sp pad"><span>${l}</span><button class="tg ${p[k]!==false?'on':''}" onclick="tgl('${k}')"></button></div>`;
  h=`<div class="prof"><label class="dpw">${av(me,100)}<span class="dpe">${i('cam')}</span><input type="file" accept="image/*" hidden onchange="setDp(this)"></label><b style="font-size:20px;margin-top:6px">${esc(u.name)}</b><div class="mu">@${esc(u.username)}</div><p class="mu" style="max-width:270px">${esc(u.about||'Hey! Main KhizChat use kar raha hoon')}</p><div class="row" style="justify-content:center"><button onclick="editProf()">Edit profile</button>${u.dp?'<button onclick="rmDp()">Photo hatayein</button>':''}</div></div><div class="sec">Privacy</div>${tg('seen','Last seen dikhayein')}${tg('online','Online status dikhayein')}${tg('typing','Typing indicator dikhayein')}

  ${matchMedia('(display-mode: standalone)').matches?'':'<div class="sec">App</div><div class="pad"><button class="pri" onclick="inst()" style="width:100%">Install KhizChat app</button></div>'}<div class="sec">Notifications</div><div class="pad"><button onclick="askN()" style="width:100%">Notifications allow karein</button></div>

$('#list').onclick=e=>{const o=e.target.closest('[data-o]');if(o)open(o.dataset.o)};

$('#bk').onclick=()=>{cur=null;$('#app').classList.remove('co');$('#chat').hidden=true;$('#empty').hidden=false};
function renderMsgs(){const ms=[...M.values()].filter(m=>m.from==cur||m.to==cur).sort((a,b)=>a.ts-b.ts);
 const un=ms.filter(m=>m.from==cur&&m.to==me&&!m.read);
 if(un.length&&!document.hidden){const b=fs.batch();un.forEach(m=>{b.update(fs.collection('msgs').doc(m.id),{read:true});m.read=true});b.commit().catch(()=>{})}
 const s=ms.map(m=>m.id+(m.read?1:0)+(m.del?'d':'')+(m.edited?m.text.length:'')+Object.values(m.react||{}).join('')).join();if(s==sig)return;sig=s;const B=$('#msgs');
 let ld='';B.innerHTML=ms.map(m=>{const mine=m.from==me;let x;const dk=new Date(m.ts).toDateString(),sep=dk!=ld?(ld=dk,`<div class="dsep"><span>${dl(m.ts)}</span></div>`):'';
 if(m.del)x='<i class="mu">🚫 Yeh message delete kar diya gaya</i>';
 else x=(m.reply?`<div class="qt"><b>${m.reply.u==me?'You':esc(nm(m.reply.u))}</b>${esc(m.reply.t)}</div>`:'')+(m.type=='text'?esc(m.text).replace(/\n/g,'<br>'):m.type=='img'?`<img src="${m.data}">`:m.type=='vid'?`<video controls playsinline src="${m.data}"></video>`:`<audio controls src="${m.data}"></audio>`);
 const rc=Object.values(m.react||{}),rx=rc.length?`<span class="rx">${[...new Set(rc)].join('')}${rc.length>1?' '+rc.length:''}</span>`:'';
 return sep+`<div class="m ${mine?'me':''}" data-m="${m.id}">${x}<small>${m.edited?'edited · ':''}${tm(m.ts)} ${mine?`<span class="tk ${m.read?'r':''}">${m.read?'✓✓':'✓'}</span>`:''}</small>${rx}</div>`}).join('');B.scrollTop=B.scrollHeight}
/* ---------- chat actions ---------- */
function send(type,text,data){if(!cur)return;fs.collection('msgs').add({from:me,to:cur,type,text:text||'',data:data||'',ts:Date.now(),read:false,react:{},reply:rp?{u:rp.from,t:prv(rp)}:null}).catch(e=>toast('Send fail: '+e.code));setRp(null)}
$('#sd').onclick=()=>{const t=$('#tx').value.trim();if(!t)return;$('#tx').value='';send('text',t)};
$('#tx').onkeydown=e=>{if(e.key=='Enter'&&!e.shiftKey){e.preventDefault();$('#sd').click()}};

function pic(f,max,qq){return new Promise((res,rej)=>{const im=new Image(),u=URL.createObjectURL(f);im.onload=()=>{const s=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*s;c.height=im.height*s;c.getContext('2d').drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(u);res(c.toDataURL('image/jpeg',qq))};im.onerror=rej;im.src=u})}
const bd=b=>new Promise(r=>{const f=new FileReader();f.onload=()=>r(f.result);f.readAsDataURL(b)});
async function sendFile(f,type){try{const d=type=='img'?await pic(f,900,.6):await bd(f);if(d.length>950000)return toast('File bari hai: video/voice ki limit ~700KB');send(type,'',d)}catch(e){toast('File error')}}

$('#mic').onclick=async()=>{const b=$('#mic');if(rec&&rec.state=='recording'){rec.stop();return}
 try{const s=await navigator.mediaDevices.getUserMedia({audio:true});rec=new MediaRecorder(s);chunks=[];rec.ondataavailable=e=>chunks.push(e.data);
  rec.onstop=()=>{s.getTracks().forEach(t=>t.stop());b.classList.remove('rec');sendFile(new Blob(chunks,{type:rec.mimeType||'audio/webm'}),'aud')};rec.start();b.classList.add('rec');toast('Recording… dobara dabayein bhejne ke liye')}catch(e){toast('Mic permission chahiye')}};
async function addF(){const u=$('#fu').value.trim().toLowerCase().replace('@','');if(!u)return;
 try{const s=await fs.collection('users').where('username','==',u).get();if(s.empty)return toast('Yeh username nahi mila');const t=s.docs[0].id;
  if(t==me)return toast('Apne aap ko add nahi kar sakte');
  if([...R.values()].some(r=>r.st!='x'&&(r.from==me&&r.to==t||r.from==t&&r.to==me)))return toast('Request pehle se maujood hai');
  await fs.collection('reqs').doc(me+'_'+t).set({from:me,to:t,st:'p',ts:Date.now()});$('#fu').value='';toast('Request bhej di ✓')}catch(e){toast('Error: '+e.code)}}
const resp=(id,ok)=>fs.collection('reqs').doc(id).update({st:ok?'a':'x'});
function postSt(){const t=$('#stx').value.trim();if(!t)return;fs.collection('status').add({u:me,text:t,data:'',ts:Date.now()});$('#stx').value=''}
async function postImg(inp){const f=inp.files[0];if(!f)return;try{fs.collection('status').add({u:me,text:'',data:await pic(f,800,.6),ts:Date.now()})}catch(e){toast('Photo error')}inp.value=''}
const tgl=k=>fs.collection('users').doc(me).update({['priv.'+k]:U[me].priv[k]===false});
const theme=t=>fs.collection('users').doc(me).update({theme:t});
function logout(){unsub.forEach(f=>f());auth.signOut().then(()=>location.reload())}
/* ---------- sound + notifications ---------- */
function actx(){try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();if(ac.state=='suspended')ac.resume()}catch(e){}}
function tone(f,d){if(!ac)return;const o=ac.createOscillator(),g=ac.createGain();o.frequency.value=f;g.gain.value=.12;o.connect(g);g.connect(ac.destination);o.start();o.stop(ac.currentTime+d)}
const beep=()=>tone(880,.15);
function startRing(){if(ri)return;const r=()=>{tone(660,.3);setTimeout(()=>tone(520,.3),350)};r();ri=setInterval(r,1500);try{navigator.vibrate&&navigator.vibrate([400,200,400])}catch(e){}}
function stopRing(){clearInterval(ri);ri=null}
function askN(){if(!('Notification' in window))return toast('Browser support nahi karta');Notification.requestPermission().then(p=>toast(p=='granted'?'Notifications on ✓':'Permission denied'))}
function push(t,b){toast(t+': '+b);try{if(Notification.permission!='granted')return;if(navigator.serviceWorker&&navigator.serviceWorker.ready)navigator.serviceWorker.ready.then(r=>r.showNotification(t,{body:b,icon:'icon-192.png',badge:'icon-192.png',vibrate:[200,100,200],tag:'khizchat'})).catch(()=>{});else new Notification(t,{body:b})}catch(e){}}
function notify(){for(const m of M.values())if(m.to==me&&!known.has(m.id)){known.add(m.id);if(ready&&(document.hidden||cur!=m.from)){push(nm(m.from),m.type=='text'?m.text:'📎 Media');beep()}}
 for(const r of R.values())if(r.to==me&&r.st=='p'&&!known.has(r.id)){known.add(r.id);if(ready){push('Friend request',nm(r.from)+' ne request bheji');beep()}}}
/* ---------- calls: WebRTC + Firestore signaling (trickle ICE) ---------- */
const TU='openrelayproject';
const ICE={iceServers:[{urls:['stun:stun.l.google.com:19302','stun:stun1.l.google.com:19302']},
 {urls:'turn:openrelay.metered.ca:80',username:TU,credential:TU},{urls:'turn:openrelay.metered.ca:443',username:TU,credential:TU},{urls:'turn:openrelay.metered.ca:443?transport=tcp',username:TU,credential:TU}]};
const act=()=>[...CL.values()].filter(c=>c.st=='on'||(c.st=='ring'&&(c.from==me?Date.now()-c.ts<40000:Date.now()-(ringSeen[c.id]=ringSeen[c.id]||Date.now())<40000))).sort((a,b)=>a.ts-b.ts).pop();
function addCand(c){if(!c)return;const s=JSON.stringify(c);if(cid)fs.collection('calls').doc(cid).update({[myField]:firebase.firestore.FieldValue.arrayUnion(s)}).catch(()=>{});else q.push(s)}
async function mkpc(kind){endMedia();pc=new RTCPeerConnection(ICE);
 ls=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true},video:kind=='video'?{facingMode:'user'}:false});
 ls.getTracks().forEach(t=>pc.addTrack(t,ls));
 pc.onicecandidate=e=>addCand(e.candidate);
 pc.ontrack=e=>{rs=e.streams[0];const v=$('#rv');if(v){v.srcObject=rs;v.play().catch(()=>{})}};
 pc.onconnectionstatechange=()=>{if(pc.connectionState=='connected'&&!tConn)tConn=Date.now();if(pc.connectionState=='failed')toast('Connection fail: network check karein');rf()}}
function applyCands(c){if(!pc||!pc.remoteDescription)return;const f=c.from==me?'ecand':'ccand';(c[f]||[]).forEach(s=>{if(!applied.has(s)){applied.add(s);pc.addIceCandidate(JSON.parse(s)).catch(()=>{})}})}
async function call(u,kind){if(act())return toast('Pehle se call chal rahi hai');actx();const id='c'+Date.now()+me.slice(0,4);
 try{myField='ccand';await mkpc(kind);await pc.setLocalDescription(await pc.createOffer());
  await fs.collection('calls').doc(id).set({from:me,to:u,kind,st:'ring',ts:Date.now(),dur:0,offer:JSON.stringify(pc.localDescription),ccand:[],ecand:[]});
  cid=id;if(q.length){const a=q;q=[];await fs.collection('calls').doc(id).update({ccand:firebase.firestore.FieldValue.arrayUnion(...a)})}}
 catch(e){toast('Mic/camera permission allow karein');endMedia()}}
$('#ca').onclick=()=>cur&&call(cur,'audio');$('#cv').onclick=()=>cur&&call(cur,'video');
async function accept(id){const c=CL.get(id);actx();myField='ecand';
 try{await mkpc(c.kind);cid=id;await pc.setRemoteDescription(JSON.parse(c.offer));remSet=true;await pc.setLocalDescription(await pc.createAnswer());
  await fs.collection('calls').doc(id).update({st:'on',answer:JSON.stringify(pc.localDescription)});applyCands(c)}
 catch(e){toast('Mic/camera permission allow karein');endCall(id)}}
function endCall(id){const c=CL.get(id);if(!c)return;fs.collection('calls').doc(id).update({st:c.st=='on'?'end':(c.to==me?'declined':'cancelled'),dur:tConn?Math.round((Date.now()-tConn)/1000):0})}
function endMedia(){try{pc&&pc.close()}catch(e){}pc=null;if(ls)ls.getTracks().forEach(t=>t.stop());ls=rs=null;cid=null;q=[];applied=new Set();remSet=false;tConn=0}
function tmute(){if(!ls)return;const t=ls.getAudioTracks()[0];if(!t)return;t.enabled=!t.enabled;const b=$('#bm');b.innerHTML=i(t.enabled?'mic':'micoff');b.classList.toggle('off',!t.enabled)}
function tcam(){if(!ls)return;const t=ls.getVideoTracks()[0];if(!t)return;t.enabled=!t.enabled;const b=$('#bc');b.innerHTML=i(t.enabled?'video':'videooff');b.classList.toggle('off',!t.enabled)}
function callUI(){const c=act(),o=$('#ov');
 for(const x of CL.values())if(x.st=='ring'&&x.from==me&&Date.now()-x.ts>=40000)fs.collection('calls').doc(x.id).update({st:'missed'}).catch(()=>{});
 if(!c){if(!o.hidden){o.hidden=true;o.dataset.k='';o.innerHTML=''}stopRing();if(pc||ls)endMedia();return}
 const on=c.st=='on',vid=c.kind=='video',k=c.id+c.st,inc=c.to==me&&c.st=='ring',other=c.from==me?c.to:c.from;
 if(inc){startRing();if(ringId!=c.id){ringId=c.id;push('Incoming '+c.kind+' call',nm(c.from))}}else stopRing();
 if(c.from==me&&c.answer&&pc&&!remSet){remSet=true;pc.setRemoteDescription(JSON.parse(c.answer)).then(()=>applyCands(c)).catch(()=>{remSet=false})}
 applyCands(c);
 if(o.dataset.k!=k){o.dataset.k=k;o.hidden=false;const showV=on&&vid;
  o.innerHTML=`<video id="rv" autoplay playsinline class="${showV?'':'hid'}"></video>${showV?'<video id="lv" autoplay muted playsinline></video>':''}
  <div class="cinfo ${showV?'top':''}">${showV?'':`<div class="${inc?'pulse':''}" style="border-radius:50%">${av(other,120)}</div>`}<h2>${esc(nm(other))}</h2><p id="cs" class="mu" style="color:#cbd5ff">${inc?'Incoming '+c.kind+' call…':on?'Connecting…':'Calling…'}</p></div>
  <div class="ctl">${inc?`<button class="rb r" onclick="endCall('${c.id}')">${i('phone')}</button><button class="rb g pulse" onclick="accept('${c.id}')">${i('phone')}</button>`:`${on?`<button class="rb gl" id="bm" onclick="tmute()">${i('mic')}</button>${vid?`<button class="rb gl" id="bc" onclick="tcam()">${i('video')}</button>`:''}`:''}<button class="rb r" onclick="endCall('${c.id}')">${i('phone')}</button>`}</div>`;
  const rv=$('#rv'),lv=$('#lv');if(rv&&rs){rv.srcObject=rs;rv.play().catch(()=>{})}if(lv&&ls){lv.srcObject=ls;lv.play().catch(()=>{})}}
 if(on){const x=$('#cs');if(x){const s=tConn?Math.round((Date.now()-tConn)/1000):-1;x.textContent=s<0?'Connecting…':Math.floor(s/60)+':'+String(s%60).padStart(2,'0')}}}
setInterval(()=>{if(me&&!$('#ov').hidden)callUI()},1000);

/* ---------- v4: DP, reply, reactions, delete, PWA ---------- */
let rp=null,dip=null;
function picSq(f,sz){return new Promise((res,rej)=>{const im=new Image(),u=URL.createObjectURL(f);im.onload=()=>{const m=Math.min(im.width,im.height),c=document.createElement('canvas');c.width=c.height=sz;c.getContext('2d').drawImage(im,(im.width-m)/2,(im.height-m)/2,m,m,0,0,sz,sz);URL.revokeObjectURL(u);res(c.toDataURL('image/jpeg',.8))};im.onerror=rej;im.src=u})}
async function setDp(inp){const f=inp.files[0];if(!f)return;try{await fs.collection('users').doc(me).update({dp:await picSq(f,200)});toast('Photo update ho gayi ✓')}catch(e){toast('Photo error')}inp.value=''}
const rmDp=()=>fs.collection('users').doc(me).update({dp:firebase.firestore.FieldValue.delete()});
function editProf(){const n=prompt('Aapka naam',U[me].name);if(n===null)return;const a=prompt('About / bio (max 80)',U[me].about||'');if(a===null)return;fs.collection('users').doc(me).update({name:n.trim()||U[me].name,about:a.trim().slice(0,80)})}
const prv=m=>m.type=='text'?m.text.slice(0,80):({img:'📷 Photo',vid:'🎬 Video',aud:'🎤 Voice message'})[m.type];
const hideMM=()=>$('#mm').hidden=true;
function showMM(m,el){const r=el.getBoundingClientRect(),d=$('#mm'),mine=m.from==me;
 d.innerHTML=`<div class="rr">${['👍','❤️','😂','😮','😢','🙏'].map(e=>`<button onclick="react('${m.id}','${e}')">${e}</button>`).join('')}</div><div class="ac"><button onclick="setRp('${m.id}')">↩ Reply</button>${m.type=='text'?`<button onclick="cpy('${m.id}')">⧉ Copy</button>`:''}${mine&&m.type=='text'?`<button onclick="edMsg('${m.id}')">✎ Edit</button>`:''}${mine?`<button onclick="delMsg('${m.id}')" style="color:#e11d48">🗑 Delete</button>`:''}</div>`;
 d.hidden=false;const h=d.offsetHeight,w=d.offsetWidth;let t=r.top-h-6;if(t<8)t=Math.min(r.bottom+6,innerHeight-h-8);d.style.top=t+'px';d.style.left=Math.min(Math.max(8,mine?r.right-w:r.left),innerWidth-w-8)+'px'}
$('#msgs').addEventListener('click',e=>{if(e.target.closest('audio,video'))return;if(e.target.tagName=='IMG'&&e.target.closest('.m')){lb(e.target.src);return}const el=e.target.closest('[data-m]');if(!el)return hideMM();const m=M.get(el.dataset.m);if(!m||m.del)return;showMM(m,el)});
document.addEventListener('click',e=>{if(!e.target.closest('#mm,[data-m]'))hideMM()});
function react(id,e){hideMM();const m=M.get(id);fs.collection('msgs').doc(id).update({['react.'+me]:(m.react||{})[me]==e?firebase.firestore.FieldValue.delete():e}).catch(()=>{})}
function delMsg(id){hideMM();if(confirm('Sab ke liye delete karein?'))fs.collection('msgs').doc(id).update({del:true,text:'',data:''}).catch(()=>{})}
function setRp(id){hideMM();rp=id?M.get(id):null;$('#rpb').hidden=!rp;if(rp){$('#rpt').textContent='↩ '+(rp.from==me?'You':nm(rp.from))+': '+prv(rp);$('#tx').focus()}}
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();dip=e;$('#instb').hidden=false});
window.addEventListener('appinstalled',()=>{dip=null;$('#instb').hidden=true;toast('KhizChat install ho gaya ✓')});
async function inst(){if(dip){dip.prompt();await dip.userChoice;dip=null;$('#instb').hidden=true}else toast('Chrome menu (⋮) → Install app / Add to Home screen')}
if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));

/* ---------- v5: search, pin, emoji, edit, copy, contact info, date separators ---------- */
let qs='',fl='all';
const sd=(a,b)=>new Date(a).toDateString()==new Date(b).toDateString();
const dl=t=>{const n=Date.now();return sd(t,n)?'Today':sd(t,n-864e5)?'Yesterday':new Date(t).toLocaleDateString([],{day:'numeric',month:'short',year:'numeric'})};
const lt=t=>{const n=Date.now();return sd(t,n)?tm(t):sd(t,n-864e5)?'Yesterday':new Date(t).toLocaleDateString([],{day:'numeric',month:'short'})};
$('#sq').oninput=e=>{qs=e.target.value.trim().toLowerCase();renderList()};
$('#sb .chips').onclick=e=>{const b=e.target.closest('button');if(!b)return;fl=b.dataset.f;[...b.parentNode.children].forEach(x=>x.classList.toggle('on',x==b));renderList()};
function lb(src){const l=$('#lb');l.querySelector('img').src=src;l.hidden=false}
function cpy(id){hideMM();const m=M.get(id);navigator.clipboard&&navigator.clipboard.writeText(m.text).then(()=>toast('Copy ho gaya ✓')).catch(()=>toast('Copy nahi hua'))}
function edMsg(id){hideMM();const m=M.get(id),n=prompt('Message edit karein',m.text);if(n===null||!n.trim()||n.trim()==m.text)return;fs.collection('msgs').doc(id).update({text:n.trim(),edited:true}).catch(()=>toast('Edit fail'))}
function togglePin(){const p=(U[me].pins||[]).includes(cur),F=firebase.firestore.FieldValue;fs.collection('users').doc(me).update({pins:p?F.arrayRemove(cur):F.arrayUnion(cur)});$('#md').hidden=true;toast(p?'Unpin ho gaya':'Chat pin ho gayi 📌')}
function showCI(){if(!cur||!U[cur])return;const u=U[cur],pin=(U[me].pins||[]).includes(cur),d=$('#md');
 d.innerHTML=`<div class="mc">${av(cur,110)}<h3>${esc(u.name)}</h3><div class="mu">@${esc(u.username)}</div><p style="font-size:14px">${esc(u.about||'Hey! Main KhizChat use kar raha hoon')}</p><div class="mu">${pres(cur)||''}</div><div class="row" style="justify-content:center"><button onclick="$('#md').hidden=true;call(cur,'audio')">${i('phone')} Voice</button><button onclick="$('#md').hidden=true;call(cur,'video')">${i('video')} Video</button></div><button onclick="togglePin()" style="width:100%">${i('pin')} ${pin?'Unpin chat':'Pin chat'}</button></div>`;d.hidden=false}
$('#hd .b').onclick=showCI;$('#hav').onclick=showCI;
const EMO=['😀','😁','😂','🤣','😊','😍','😘','😎','🤔','😢','😭','😡','👍','👎','🙏','👏','🙌','💪','🔥','✨','🎉','❤️','💔','💯','✅','❌','👀','🤝','😴','🤗','😇','🥰','😜','🤩','😅','😉','🙂','😮','🥺','🤲'];
$('#ep').innerHTML=EMO.map(e=>`<button>${e}</button>`).join('');
$('#ep').onclick=e=>{const b=e.target.closest('button');if(b){const t=$('#tx');t.value+=b.textContent;t.focus()}};
$('#em').onclick=()=>{$('#ep').hidden=!$('#ep').hidden};
$('#sd').addEventListener('click',()=>{$('#ep').hidden=true});
</script></body></html>
