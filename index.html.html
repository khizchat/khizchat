service cloud.firestore {
  match /databases/{database}/documents {
    match /users/{uid} {
      allow read: if request.auth != null;
      allow write: if request.auth != null && request.auth.uid == uid;
    }
    match /groups/{gid} {

        && request.auth.uid in request.resource.data.members

      allow read, update: if request.auth != null && request.auth.uid in resource.data.members;
      allow delete: if request.auth != null && resource.data.createdBy == request.auth.uid;
    }
    match /{col}/{id} {
      allow read, write: if request.auth != null && col in ['reqs','msgs','status','calls','fchunks'];
    }
  }
}
`;

const VA={},VS={},VSP=[1,1.5,2];

 a.addEventListener('timeupdate',()=>{if(a._fix){a._fix=0;a.currentTime=0;vmUI(id);return}vmUI(id)});
 a.addEventListener('ended',()=>{a.currentTime=0;vmUI(id)});a.addEventListener('play',()=>vmUI(id));a.addEventListener('pause',()=>vmUI(id));VA[id]=a}return VA[id]}

 bs.forEach((b,i)=>{b.classList.toggle('on',i<n);b.classList.toggle('cur',i==n-1&&!a.paused)});el.querySelector('.vp').textContent=a.paused?'▶':'⏸';el.classList.toggle('pl',!a.paused);

const BIGMAX=15*1048576,BL={},LD={};
function bigHTML(m){const u=BL[m.fid];
 if(u)return m.type=='vid'?`<video controls playsinline preload="metadata" src="${u}" poster="${m.data||''}"></video>`:`<img src="${u}">`;
 const p=LD[m.fid];

 const setP=p=>{LD[fid]=p;const b=document.querySelector('.bgm[data-fid="'+fid+'"] .bgo b');if(b)b.textContent=p+'%'};
 try{const parts=new Array(n);let done=0;
  for(let k=0;k<n;k+=4){const grp=[];for(let j=k;j<Math.min(n,k+4);j++)grp.push(fs.collection('fchunks').doc(fid+'_'+j).get().then(d=>{if(!d.exists)throw new Error('missing');const bin=atob(d.data().d),u=new Uint8Array(bin.length);for(let q=0;q<bin.length;q++)u[q]=bin.charCodeAt(q);parts[j]=u;done++;setP(Math.round(done*100/n))}));await Promise.all(grp)}
  BL[fid]=URL.createObjectURL(new Blob(parts,{type:m.mime||(m.type=='vid'?'video/mp4':'image/jpeg')}))}catch(e){toast('Could not load media')}
 delete LD[fid];renderMsgs()}

 v.muted=true;v.playsInline=true;v.preload='auto';setTimeout(()=>end({d:'',w:16,h:9}),5000);

async function sendBig(f,type){if(!cur)return;if(blocked(cur))return toast('Unblock this contact first');const to=cur,gg=G.get(to);if(gg&&gg.only&&!gg.admins.includes(me))return toast('Only admins can send messages');
 if(f.size>BIGMAX)return toast(f.name+': too large (max 15 MB)');
 const rpl=rp?Object.assign({u:rp.from,t:prv(rp)},rpTh?{th:rpTh}:{}):null;setRp(null);
 try{toast('Preparing '+(type=='vid'?'video':'photo')+'…');const th=await mediaThumb(f,type);if(!th&&type=='img')return toast('This photo format is not supported');
  const b64=(await bd(f)).split(',')[1],fid='m'+Date.now()+me.slice(0,4),CH=700000,n=Math.max(1,Math.ceil(b64.length/CH));
  for(let k=0;k<n;k+=3){const b=fs.batch();for(let j=k;j<Math.min(n,k+3);j++)b.set(fs.collection('fchunks').doc(fid+'_'+j),{fid,i:j,d:b64.slice(j*CH,(j+1)*CH),from:me});await b.commit();toast('⬆ '+Math.round(Math.min(n,k+3)*100/n)+'%')}
  BL[fid]=URL.createObjectURL(f);
  await fs.collection('msgs').add({from:me,to,type,text:'',data:(th&&th.d)||'',fid,n,mime:f.type||(type=='vid'?'video/mp4':'image/jpeg'),size:f.size,w:(th&&th.w)||4,h:(th&&th.h)||3,ts:Date.now(),read:false,react:{},...gx(to),reply:rpl});toast('✓ Sent')}catch(e){toast('Upload failed: '+(e.code||'error'))}}
const _sf19=sendFile;sendFile=async function(f,type){if(type=='aud'||f.size<=650000)return _sf19(f,type);return sendBig(f,type)};
$('#fl').multiple=true;$('#fl').onchange=async e=>{const l=[...e.target.files];e.target.value='';for(const f of l)await sendFile(f,f.type.startsWith('video')?'vid':'img')};

function chatMenu(u){const g=G.has(u),o=g?G.get(u):U[u];if(!o)return;const pin=(U[me].pins||[]).includes(u),mu=(U[me].muted||[]).includes(u),ar=(U[me].carch||[]).includes(u),d=$('#md');
 const R=(ic,t,fn,red)=>`<button class="cmr${red?' rd':''}" onclick="${fn}"><span class="cmi">${ic}</span>${t}</button>`;
 d.innerHTML=`<div class="mc cmn"><div class="cmh">${av(u,46)}<div><b>${esc(nm(u))}</b><div class="mu">${g?'Group':esc(unm(u))}</div></div></div>`
  +R('📌',pin?'Unpin chat':'Pin chat',`togPinU('${u}')`)
  +R(mu?'🔔':'🔇',mu?'Unmute notifications':'Mute notifications',`$('#md').hidden=true;togMute('${u}')`)

  +(g?'':R('✏️','Change name (only for me)',`editNick('${u}')`))

function togPinU(u){const p=(U[me].pins||[]).includes(u);arrUp('pins',u,!p);$('#md').hidden=true;toast(p?'Chat unpinned':'Chat pinned 📌')}
function togArch(u){const a=(U[me].carch||[]).includes(u);arrUp('carch',u,!a).then(()=>{if(!a&&cur==u)$('#bk').click()});$('#md').hidden=true;toast(a?'Moved back to chats':'Chat archived 📦')}
async function clearChat(u,del){const g=G.has(u);if(!confirm(del?'Delete this chat? Messages are removed only for you.':'Clear all messages in this chat? Only for you.'))return;$('#md').hidden=true;
 const ms=[...M.values()].filter(m=>(g?(m.g&&m.to==u):(!m.g&&(m.from==u||m.to==u)))&&!(m.hid||{})[me]);
 try{for(let k=0;k<ms.length;k+=400){const b=fs.batch();ms.slice(k,k+400).forEach(m=>b.update(fs.collection('msgs').doc(m.id),{['hid.'+me]:true}));await b.commit()}
  if(del){await arrUp('cdel',u,true);await arrUp('carch',u,false);if(cur==u)$('#bk').click()}
  toast(del?'Chat deleted':ms.length?'Chat cleared ✓':'Chat is already empty')}catch(e){toast('Could not '+(del?'delete':'clear')+' chat')}}
(function(){const L=$('#list');let t=null,sx=0,sy=0,fired=0,tg=null;const cancel=()=>{clearTimeout(t);t=null};
 L.addEventListener('pointerdown',e=>{if(tab!='chats'||(e.pointerType=='mouse'&&e.button!=0))return;const o=e.target.closest('[data-o]');if(!o)return;sx=e.clientX;sy=e.clientY;tg=o.dataset.o;cancel();t=setTimeout(()=>{t=null;fired=Date.now();navigator.vibrate&&navigator.vibrate(18);chatMenu(tg)},480)});
 L.addEventListener('pointermove',e=>{if(t&&(Math.abs(e.clientX-sx)>8||Math.abs(e.clientY-sy)>8))cancel()});
 ['pointerup','pointercancel','pointerleave'].forEach(k=>L.addEventListener(k,cancel));L.addEventListener('scroll',cancel,true);
 L.addEventListener('click',e=>{if(Date.now()-fired<700){e.stopImmediatePropagation();e.preventDefault()}},true);
 L.addEventListener('contextmenu',e=>{const o=e.target.closest('[data-o]');if(!o||tab!='chats')return;e.preventDefault();if(Date.now()-fired<700)return;fired=Date.now();chatMenu(o.dataset.o)})})();
